[project]
name = "mindmate-backend"
version = "0.1.0"
description = "MindMate AI local FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "pypdf>=6.0,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "sqlite-vec>=0.1.6,<1",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.34,<1",
  "uuid6>=2024.7,<2026",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindmate"]

[dependency-groups]
dev = [
  "keyring>=25.6,<26",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "pyright>=1.1.390,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
