project:
  name:
    value: mindmate-ai
    state: CONFIRMED
    source: SRC-001
  type:
    value: 个人AI知识学习助手
    state: CONFIRMED
    source: SRC-001, SRC-002, SRC-003
  scenario:
    value: NEW_PROJECT
    state: CONFIRMED
    source: SRC-007
  lifecycle:
    value: NEW
    state: CONFIRMED
    source: SRC-007
  stage:
    value: BOOTSTRAP
    state: CONFIRMED
    source: SRC-007
  repository_role:
    value: NONE
    state: CONFIRMED
    source: SRC-007, EVID-001
  code_baseline_mode:
    value: NONE
    state: CONFIRMED
    source: SRC-007, EVID-001

business:
  usage_scenarios:
    value:
      - 创建个人知识库
      - 上传和处理学习资料
      - 基于指定资料问答
      - 查看真实引用
      - 基于资料逐题学习陪练
      - 恢复历史会话
    state: CONFIRMED
    source: SRC-002, SRC-003
  target_users:
    value:
      - 学生和备考者
      - 自学者
      - 初级开发者
      - 知识工作者
    state: CONFIRMED
    source: SRC-002, SRC-003
  project_goal:
    value: 将个人文件转化为可查询、可追溯、可练习的个人知识库
    state: CONFIRMED
    source: SRC-002, SRC-003
  core_capabilities:
    value:
      - 知识库管理
      - PDF/DOCX/Markdown/TXT 文件上传和处理
      - 自由对话
      - 资料问答
      - 引用溯源
      - 学习陪练
      - 历史会话
    state: CONFIRMED
    source: SRC-003
  deferred_capabilities:
    value:
      - 设置页面
      - 独立错题本
      - OCR
      - 多智能体
      - 工作流编排
      - 团队权限
      - 联网搜索
      - 语音陪练
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001

scale:
  label:
    value: S
    state: PROVISIONAL
    basis: 单用户、小量个人资料；每个知识库约 50 份文件，单用户约 10 个知识库
    source: SRC-003
  capacity_targets:
    knowledge_bases_per_user: 10
    files_per_knowledge_base: 50
    single_file_size: 20MB
    files_per_upload: 5
    state: CONFIRMED_FOR_V1
    source: SRC-003, DEC-BOOTSTRAP-001

data:
  types:
    value:
      - userId 和资源归属标识
      - 知识库
      - 原始文件和文件元数据
      - 解析文本和文档片段
      - 向量数据
      - 标签和摘要
      - 会话、消息和引用
      - 陪练会话、题目、回答和点评
    state: CONFIRMED
    source: SRC-003
  ownership:
    value: userId 保留，服务层必须执行资源归属校验
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001
  local_storage:
    value: 原始文件、解析结果、业务数据和向量数据默认本地保存
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001
  retention_and_backup:
    value: TBD
    state: TBD
    source: OPEN-01, OPEN-04

ai:
  capabilities:
    value:
      - 文档解析后的摘要和标签生成
      - Embedding
      - 向量检索和后续重排
      - 查询重写
      - 基于证据的回答
      - 引用绑定和证据不足拒答
      - 流式回答
      - 逐题出题和点评
    state: CONFIRMED_AS_PRODUCT_NEED
    source: SRC-003
  model_provider_mode:
    value: EXTERNAL_PROVIDER
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001
  embedding_provider_mode:
    value: EXTERNAL_PROVIDER
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001
  provider_adapter:
    value: LOCAL_BACKEND_ADAPTER
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001
  provider_name:
    value: TBD
    state: TBD
    source: OPEN-01
  model_name:
    value: TBD
    state: TBD
    source: OPEN-01
  embedding_model_name:
    value: TBD
    state: TBD
    source: OPEN-01
  external_data_boundary:
    value: 仅发送当前任务必要的问题、文本片段和上下文，并提示外部模型可能接收必要文本
    state: CONFIRMED
    source: DEC-BOOTSTRAP-001

