workflow:
  base_lifecycle: G0-G11
  scenario: NEW_PROJECT
  current_stage: DEVELOPMENT
  current_stage_level: L3
  workflow_status: ACTIVE_DEVELOPMENT
  requirements_baseline: docs/project/requirements/v1/18_最终决策表.md
  development_taskbook: docs/project/requirements/v1/16_Codex开发任务书.md
  technical_constraints: docs/project/requirements/v1/15_技术架构与开发约束.md
  baseline_tag: baseline/pre-v1-rebaseline-2026-09-22
  development_branch: feat/v1-bootstrap
  provider_runtime_mode: MOCK_ONLY
  provider_decision_status: FROZEN_BY_V1_REQUIREMENTS
  provider_change_status: APPLIED_CONDITIONAL
  current_chat_provider: DEEPSEEK_API
  current_chat_model: deepseek-flash
  current_chat_model_status: APPLIED_CONDITIONAL
  embedding_provider: LOCAL
  current_embedding_model: BAAI/bge-small-zh-v1.5
  embedding_decision_status: APPLIED_CONDITIONAL_SPIKE_REQUIRED
  vector_store_strategy: LOCAL_EMBEDDED_ADAPTER
  vector_store_product_status: TBD_SPIKE_REQUIRED
  cost_policy_status: APPLIED_NOT_IMPLEMENTED
  monthly_soft_budget: USD 5
  cost_alert_threshold: USD 4
  cost_stop_threshold: USD 5
  provider_runtime_enabled: false
  provider_guard_status: NOT_A_DEVELOPMENT_GATE
  workflow_confirmation_constraints:
    - 本地单用户 MVP
    - 外部 Provider 只发送完成当前任务所必需的文本和上下文
    - 模型和 Embedding 通过本地后端 Provider Adapter 接入
    - 原始文件、业务数据和向量数据默认保存在本地
    - 采用模块化单体
    - V1 不包含设置页和独立错题本
    - API 采用 REST + OpenAPI 方向
    - G3 完成前不得进入开发和项目脚手架创建
  execution_flow:
    id: FLOW-01
    name: AI 前端 Mock 先行型
    status: PROPOSED
    rationale:
      - 新建桌面 Web 项目且当前没有 API 或代码基线
      - 存在可复用的结构化设计参考
      - 单用户 MVP 适合先验证页面、状态和核心垂直链路
      - 模块化单体和本地运行形态降低后端环境成本
    not_selected:
      FLOW-02: 后端和 RAG 风险尚未完成 Spike，当前不先把所有实现冻结为后端先行
      FLOW-03: 当前没有已稳定 API
      FLOW-04: 项目不是内容站
      FLOW-05: 项目包含 Web 用户端和 AI 交互
      FLOW-06: 单人/小规模项目不制造虚假多端并行
    reevaluate_when:
      - Provider 或本地解析/RAG Spike 成为主要阻塞
      - API 和数据模型必须先于 UI 冻结
      - 从本地单用户扩展为公网多用户
      - 增加小程序或其他客户端
      - 团队方式从单人转为多团队并行

stage_policy:
  - id: G0
    enabled: true
    level: L1
    purpose: 复用现有治理资产并确认项目入口
    simplified: 不重建 doc/ 通用目录和模板
    cannot_omit: 事实源、权限、项目状态和证据边界
    entry: AGENTS.md 和通用治理资产可读
    exit: 项目级文档路径和运行边界明确
  - id: G1
    enabled: true
    level: L2
    purpose: 登记业务、设计和控制输入资料
    simplified: 单人项目合并来源批次摘要
    cannot_omit: 来源编号、版本、路径、用途、优先级、可读性和边界
    evidence: SRC-REGISTER-001、EVID-001、EVID-002、EVID-003
    exit: COMPLETED
  - id: G2
    enabled: true
    level: L2
    purpose: 形成来源、决策、冲突和待确认基线
    simplified: 合并重复产品描述，不复制原始资料
    cannot_omit: 决策证据、冲突矩阵、TBD、来源追踪和 G3 入口门禁
    evidence: G2-BASELINE-README-001、DEC-BOOTSTRAP-001
    exit: COMPLETED
    next_gate: G3_NOT_STARTED
  - id: G3
    enabled: true
    level: L3
    purpose: PRD 准入审计
    entry: Workflow CONFIRMED，G2 基线 active
    simplified: 可合并审计表，但不得省略 P0/P1、状态、权限、异常、验收和追踪
    cannot_omit: Given/When/Then、页面范围、引用、数据归属和删除影响
    current_status: PASSED_G4_ENTRY_READY
  - id: G4
    enabled: true
    level: L2
    purpose: 形成 PRD Draft
    simplified: 产品主 PRD 可合并模块叙述
    cannot_omit: 范围、非目标、业务规则、状态、异常、验收和来源
    current_status: COMPLETED_PRD_DRAFT
    evidence: PRD-MINDMATE-V1、EVID-012、EVID-013
  - id: G5
    enabled: true
    level: L3
    purpose: PRD 评审和批准
    simplified: 低影响文案可延后
    cannot_omit: 高影响业务决策、P0/P1、批准证据和追踪
    current_status: COMPLETED_PRD_APPROVED
    entry: PRD_STATUS=READY_FOR_APPROVAL；G5_ENTRY_GATE=READY
  - id: G5.5
    enabled: true
    level: L1
    purpose: 根据 Approved PRD 建立 UI 逻辑范围
    conditional: PRD Approved 且 GENERATE_UI_REFERENCE_TREE=true
    cannot_omit: 页面、模块、目标终端和设计来源映射
    current_status: COMPLETED_UI_LOGIC_SCOPE_DRAFT
    entry: PRD_STATUS=APPROVED；G5_APPROVAL_STATUS=COMPLETED
    evidence: UI-LOGIC-SCOPE-MINDMATE-001、EVID-021、EVID-022、EVID-023
  - id: G6
    enabled: true
    level: L3
    purpose: 总体技术架构和 TECH-DECISION
    simplified: 首版优先比较模块化单体、Provider Adapter、本地数据和内部异步任务
    cannot_omit: 数据归属、Provider、隐私、文件、RAG、部署、失败恢复和回滚
    current_status: BLOCKED_OPEN_01
    entry: G5.5_STATUS=COMPLETED；G6_ENTRY_GATE=READY
    execution: BLOCKED
    exit_gate: BLOCKED_TECH-DEC-004
    evidence: EVID-023（入口）；EVID-024（架构 Draft）；EVID-025（C/no-call 已应用）；EVID-026（候选评审）；EVID-027（A 初选）；EVID-028（A 二次确认）；EVID-029（Alibaba 历史条件性应用）；EVID-032（DeepSeek Chat 修订应用）；EVID-033（DeepSeek Guard 阻断）；EVID-034（四项 G6 剩余决策批量应用）
  - id: G7
    enabled: true
    level: L2
    purpose: 技术模块边界
    simplified: 不按微服务拆分，不按页面或表机械拆分
    cannot_omit: 数据所有权、依赖、事务、测试和发布边界
    current_status: NOT_STARTED_G6_EXIT_BLOCKED
    entry_gate: NOT_READY
  - id: G8
    enabled: true
    level: L2
    purpose: 模块详细技术设计
    simplified: 低风险设置延期，不为延后能力做完整设计
    cannot_omit: 文件状态、RAG/引用、会话、陪练、异常、重试和安全
  - id: G9
    enabled: true
    level: L3
    purpose: API、数据和编码规范
    simplified: 首版只设计核心资源和必要契约
    cannot_omit: REST/OpenAPI、错误、分页、状态、幂等、归属、迁移和测试
  - id: G9.1
    enabled: true
    level: L1
    purpose: 生成真实 UI 应用目录
    conditional: 应用架构和 PROJECT_STRUCTURE 已确认
    cannot_omit: 真实应用、代码路径、目标设备和 PRD 映射
  - id: G9.5
    enabled: false
    level: L0
    purpose: 正式 UI_SPEC
    reason: LOW-02 和 MEDIUM-01 只确认参考方式，尚未要求正式 Design Token 和像素级规范
    reopen_when: 高保真、品牌化或对外视觉交付被确认
  - id: G10
    enabled: true
    level: L2
    purpose: 开发批次、有效 UI Contract 和交付
    entry: PRD、架构、API/数据和执行 Flow 已满足门禁
    simplified: 使用 FLOW-01；后台和复杂平台能力不进入 V1
    cannot_omit: 核心垂直链路、测试、人工验证、Evidence 和回滚
  - id: G11
    enabled: true
    level: L3
    purpose: 实施、联调、测试、发布和维护
    simplified: 默认不计入完整压测、专业渗透和云服务器发布
    cannot_omit: 核心闭环、基础安全、引用质量、异常恢复、验收和交接
  - id: DEVELOPMENT
    enabled: true
    level: L3
    purpose: 按冻结的 V1 规格进行代码、测试和打包开发
    entry: docs/project/requirements/v1/18_最终决策表.md、16_Codex开发任务书.md、15_技术架构与开发约束.md 已存在
    cannot_omit: 阶段 0/1 基线与 Spike、Mock Provider、测试、Evidence 和独立 Git 提交
    current_status: IN_PROGRESS
    stop_conditions: 需求冲突、冻结技术 Spike 不可行、凭据/费用权限、破坏性操作

