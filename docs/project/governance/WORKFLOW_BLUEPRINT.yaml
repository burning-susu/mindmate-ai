gates:
  workflow_confirmation:
    status: COMPLETED
    before: G3
    evidence: EVID-007；用户确认 WORKFLOW_ID=WF-MINDMATE-001、版本 0.1 和限制条件
  architecture_confirmation:
    status: REQUIRED
    before: G6 exit or architecture-dependent implementation
    evidence: TECH-DECISION review, informed confirmation and apply
  module_boundary_confirmation:
    status: REQUIRED
    before: G8
    evidence: MODULE_BOUNDARIES review and apply
  code_gate:
    status: NOT_REACHED
    rule: 不因本轮文档生成进入代码实现
