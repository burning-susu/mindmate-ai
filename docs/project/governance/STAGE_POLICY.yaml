policy:
  - 轻量化只合并文档和减少未触发能力，不删除需求、架构、API/数据、测试、验收和 Evidence 职责。
  - 不因单用户或小规模关闭安全、隐私、资源归属、删除和回滚门禁。
  - G3 及后续阶段必须等待 WORKFLOW_STATUS=CONFIRMED。
  - G6/G7 的 Draft 可以保留 TBD，但正式出口和依赖 Blocking 结论的实现必须完成知情决策和应用。
  - G9.5 暂不启用，不阻断开发；如果开启，必须生成正式 UI_SPEC 和视觉验收。

