name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/generated/openapi.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --dev
      - run: uv run python ..\scripts\export_openapi.py
      - run: git diff --exit-code -- ..\docs\openapi\openapi.json
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python -c "from mindmate.main import app; assert app.openapi()['openapi'].startswith('3.')"
